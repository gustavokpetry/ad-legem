<!doctype html>
<html lang="pt-BR" data-build="11">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ad Legem</title>
<meta name="description" content="Constituição e códigos brasileiros para estudar: leitura, lições e revisão.">
<meta name="theme-color" content="#FCFBF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A15" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ad Legem">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/ebgaramond.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* aplica tema e tamanho de texto antes de desenhar a tela (evita piscar) */
try{var d=document.documentElement,t=JSON.parse(localStorage.getItem('leiseca:theme')),f=JSON.parse(localStorage.getItem('leiseca:fs'));
var pl=JSON.parse(localStorage.getItem('leiseca:palette'));if(pl)d.dataset.palette=pl;if(t)d.dataset.theme=t;if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)d.classList.add('isdark');if(f)d.dataset.fs=f;}catch(e){}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="mark" href="./" data-go="buscar" aria-label="Ad Legem, voltar ao início"><img src="seal.svg" alt="" width="30" height="30"><span>AD LEGEM</span></a>
    <nav class="nav" aria-label="Seções">
      <button data-go="buscar"><span>Buscar</span></button><button data-go="estudar"><span>Estudar</span></button><button data-go="grifos"><span>Grifos</span></button>
    </nav>
    <button class="menubtn" id="menubtn" aria-label="Configurações"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-buscar">
    <div class="hero" id="hero">
      <img src="seal.svg" alt="" width="64" height="64">
      <div><h1>AD LEGEM</h1><p>leges Brasiliae</p></div>
    </div>
    <div class="finder">
      <label class="sbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><input id="q" type="search" placeholder="Busque uma palavra ou um artigo" autocomplete="off" enterkeyhint="search" aria-label="Buscar na lei"></label>
      <div class="tabs" id="tabs" role="toolbar" aria-label="Filtrar por código" hidden></div>
    </div>
    <div id="results"></div>
  </section>

  <section class="view study" id="v-estudar" hidden>
    <div id="studyhome"></div>
    <div id="trackview" hidden></div>
    <div id="studyrun" hidden></div>
  </section>

  <section class="view" id="v-grifos" hidden></section>
</main>

<nav class="bnav" aria-label="Seções">
  <button data-go="buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><span>Buscar</span></button><button data-go="estudar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6.5" width="13" height="14" rx="1"/><path d="M7.5 3.5h12a1 1 0 0 1 1 1v13"/></svg><span>Estudar</span></button><button data-go="grifos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5l4 4-9 9H6.5v-4z"/><path d="M4 21h16"/><path d="M13 7l4 4"/></svg><span>Grifos</span></button>
</nav>

<div class="pageview" id="sheet" role="dialog" aria-modal="true" aria-labelledby="pg-title" hidden>
  <div class="ribbon" id="pg-ribbon" aria-hidden="true" hidden></div>
  <div class="pg-bar">
    <button class="circ cc" id="sh-close" aria-label="Fechar o artigo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="circ" id="sh-fs" aria-label="Mudar o tamanho do texto">A<small>A</small></button>
    <a class="circ ext" id="sh-src" target="_blank" rel="noopener" aria-label="Ver na fonte oficial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 4.5h6v6M19.5 4.5l-8 8M17 14v5.5H4.5V7H10"/></svg></a>
  </div>
  <div class="pg-scroll" id="pg-scroll">
    <div class="pg-inner" id="sh-body"></div>
  </div>
  <nav class="pg-turn" aria-label="Virar a página">
    <button id="sh-prev" class="turn prev"></button>
    <span class="folio" id="pg-folio" aria-hidden="true"></span>
    <button id="sh-next" class="turn next"></button>
  </nav>
</div>

<div class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="set-title" hidden>
  <div class="set-bar"><button class="circ" id="set-close" aria-label="Fechar as configurações"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="set-title">Configurações</h2></div>
  <div class="set-scroll">
    <div class="set-wrap">
      <h3 class="set-h">Aparência</h3>
      <div class="set-card">
        <div class="palettes" role="radiogroup" aria-label="Cores do app"><button role="radio" data-set="palette" data-val="classico" class="pal pal-classico"><span class="pal-dot" aria-hidden="true"></span><span class="pal-n">Clássico</span></button><button role="radio" data-set="palette" data-val="grafite" class="pal pal-grafite"><span class="pal-dot" aria-hidden="true"></span><span class="pal-n">Grafite</span></button><button role="radio" data-set="palette" data-val="marinho" class="pal pal-marinho"><span class="pal-dot" aria-hidden="true"></span><span class="pal-n">Marinho</span></button><button role="radio" data-set="palette" data-val="bordo" class="pal pal-bordo"><span class="pal-dot" aria-hidden="true"></span><span class="pal-n">Bordô</span></button><button role="radio" data-set="palette" data-val="sepia" class="pal pal-sepia"><span class="pal-dot" aria-hidden="true"></span><span class="pal-n">Sépia</span></button></div>
        <div class="seg" role="radiogroup" aria-label="Tema"><button role="radio" data-set="theme" data-val="auto">Automático</button><button role="radio" data-set="theme" data-val="light">Claro</button><button role="radio" data-set="theme" data-val="dark">Escuro</button></div>
        <div class="set-row"><span>Texto</span><div class="seg sm" role="radiogroup" aria-label="Tamanho do texto"><button role="radio" data-set="fs" data-val="0">A</button><button role="radio" data-set="fs" data-val="1">A+</button><button role="radio" data-set="fs" data-val="2">A++</button></div></div>
      </div>

      <h3 class="set-h">Leitura</h3>
      <div class="set-card">
        <label class="sw"><span class="sw-t">Ocultar revogados</span><input type="checkbox" role="switch" data-set="hiderev"><span class="knob" aria-hidden="true"></span></label>
        <label class="sw"><span class="sw-t">Notas de redação</span><input type="checkbox" role="switch" data-set="notes"><span class="knob" aria-hidden="true"></span></label>
      </div>

      <h3 class="set-h">Cores dos grifos</h3>
      <div class="set-card"><label class="mkname"><span class="sw-dot mk-y" aria-hidden="true"></span><span class="vh">Nome da cor amarela</span><input type="text" maxlength="24" data-markname="y" autocomplete="off"></label><label class="mkname"><span class="sw-dot mk-g" aria-hidden="true"></span><span class="vh">Nome da cor verde</span><input type="text" maxlength="24" data-markname="g" autocomplete="off"></label><label class="mkname"><span class="sw-dot mk-p" aria-hidden="true"></span><span class="vh">Nome da cor rosa</span><input type="text" maxlength="24" data-markname="p" autocomplete="off"></label></div>

      <h3 class="set-h">Estudo</h3>
      <div class="set-card">
        <div class="set-row"><span>Questões por lição</span><div class="seg sm" role="radiogroup" aria-label="Questões por lição"><button role="radio" data-set="qmax" data-val="5">5</button><button role="radio" data-set="qmax" data-val="8">8</button><button role="radio" data-set="qmax" data-val="10">10</button></div></div>
        <label class="sw"><span class="sw-t">Pergunta “Qual é o artigo?”</span><input type="checkbox" role="switch" data-set="qartigo"><span class="knob" aria-hidden="true"></span></label>
      </div>

      <h3 class="set-h">Seus dados</h3>
      <div class="set-card">
        <div class="set-btns">
          <button class="go" id="bk-save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg><span>Salvar cópia</span></button>
          <button class="go ghost" id="bk-load"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14"/></svg><span>Restaurar</span></button>
          <input type="file" id="bk-file" accept="application/json,.json" hidden>
        </div>
        <button class="danger-link" id="bk-reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></svg><span>Apagar progresso</span></button>
      </div>

      <p class="set-about">Leis de <span id="set-date"></span> · não substitui o Diário Oficial<br>Ad Legem · versão 2026.10</p>
    </div>
  </div>
</div>

<div class="marksheet" id="marksheet" hidden>
  <div class="ms-panel" role="dialog" aria-modal="true" aria-labelledby="ms-title">
    <div class="ms-k">GRIFAR</div><div class="ms-t" id="ms-title"></div>
    <div class="ms-colors" id="ms-colors"></div>
    <div class="ms-row"><button class="danger-link" id="ms-remove"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></svg><span>Remover</span></button><button class="ms-cancel" id="ms-cancel">Cancelar</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="perguntas.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
